services:
  - type: web
    name: citeverify-ai
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: API_PORT
        value: "10000"
      # Hosted AI verification (Groq free tier). Set the key in the Render
      # dashboard; it is never stored in Git.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # Optional retrieval settings (set in the Render dashboard):
      # an operator mailbox for Crossref's polite pool, and a free OpenAlex key.
      - key: CITEVERIFY_CONTACT_EMAIL
        sync: false
      - key: OPENALEX_API_KEY
        sync: false
